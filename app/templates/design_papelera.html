{% extends "base.html" %}
{% block contenido %}
<style>
  .tr-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .tr-list { display:flex; flex-direction:column; gap:10px; }
  .tr-item { display:flex; align-items:flex-start; gap:12px; background:#fff; border:1px solid #d8dde3; border-radius:10px; padding:12px 14px; }
  .tr-ico { font-size:18px; margin-top:1px; }
  .tr-main { flex:1; min-width:0; }
  .tr-label { font-size:13px; font-weight:700; color:#111827; word-break:break-word; }
  .tr-meta { font-size:11px; color:#6b7280; margin-top:3px; }
  .tr-badge { display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; background:#f4f6f8; border:1px solid #d8dde3; border-radius:6px; padding:1px 6px; margin-right:6px; color:#374151; font-weight:700; }
  .tr-actions { display:flex; gap:6px; }
  .tr-restore { background:#1c3a63; color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .tr-perma { background:none; border:1px solid #d8dde3; color:#6b7280; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .tr-perma:hover { color:#dc2626; border-color:#dc2626; }
  .tr-empty { color:#6b7280; padding:40px; text-align:center; }
</style>

<div class="tr-toolbar">
  <h1 style="margin:0">Papelera — Design Schedule</h1>
  <button type="button" class="btn gris" id="trVaciarBtn">Vaciar historial</button>
</div>
<p style="color:#6b7280;font-size:13px;margin-top:-8px">Registro de borrados en Pre-Approved (hojas, centros, doctores, criterios). Se puede restaurar mientras el destino siga existiendo.</p>
<div class="tr-list" id="trList"></div>

<script>
(function() {
  var MODULOS = {"pa-sheet":"Pre-Approved · hoja", "pa-centro":"Pre-Approved · centro",
                "pa-doctor":"Pre-Approved · doctor", "pa-fila":"Pre-Approved · criterio"};

  function postJSON(url) {
    return fetch(url, {method:'POST'}).then(function(r) {
      if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'Error'); });
      return r.json();
    });
  }
  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function cargar() {
    fetch('/design/api/papelera').then(function(r) { return r.json(); }).then(render);
  }

  function render(items) {
    var list = document.getElementById('trList');
    if (!items.length) {
      list.innerHTML = '<div class="tr-empty">No hay borrados registrados.<br>Cuando alguien elimine algo en Pre-Approved, aparecerá aquí para poder restaurarlo.</div>';
      return;
    }
    list.innerHTML = items.map(function(it) {
      return '<div class="tr-item">' +
        '<div class="tr-ico">🗑️</div>' +
        '<div class="tr-main">' +
          '<div class="tr-label"><span class="tr-badge">' + esc(MODULOS[it.modulo] || it.modulo) + '</span>' + esc(it.etiqueta) + '</div>' +
          '<div class="tr-meta">Eliminado por <b>' + esc(it.eliminado_por) + '</b> · ' + esc(it.eliminado_en) + '</div>' +
        '</div>' +
        '<div class="tr-actions">' +
          '<button type="button" class="tr-restore" data-restore="' + it.id + '">↺ Restaurar</button>' +
          '<button type="button" class="tr-perma" data-perma="' + it.id + '" title="Eliminar del historial (permanente)">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('[data-restore]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        postJSON('/design/api/papelera/' + this.dataset.restore + '/restaurar')
          .then(function() { location.reload(); })
          .catch(function(e) { alert(e.message); });
      });
    });
    list.querySelectorAll('[data-perma]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (!confirm('¿Eliminar esta entrada del historial? Ya no se podrá restaurar.')) return;
        postJSON('/design/api/papelera/' + this.dataset.perma + '/eliminar')
          .then(function() { location.reload(); })
          .catch(function(e) { alert(e.message); });
      });
    });
  }

  document.getElementById('trVaciarBtn').addEventListener('click', function() {
    if (!confirm('¿Vaciar todo el historial de la papelera? Esta acción no se puede deshacer.')) return;
    postJSON('/design/api/papelera/vaciar').then(function() { location.reload(); });
  });

  cargar();
})();
</script>
{% endblock %}
