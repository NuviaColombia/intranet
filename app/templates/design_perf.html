{% extends "base.html" %}
{% block contenido %}
<style>
  .pf-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .pf-tab { padding:8px 16px; border-radius:8px; border:1px solid #d8dde3; background:#fff; cursor:pointer; font-weight:600; font-size:13px; }
  .pf-tab.activo { background:#1c3a63; color:#fff; border-color:#1c3a63; }
  .pf-panel { background:#fff; border:1px solid #d8dde3; border-radius:12px; padding:16px; overflow-x:auto; }
  .pf-toolbar { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .pf-toolbar select { padding:6px 8px; border:1px solid #d8dde3; border-radius:6px; }
  table.pf-tabla { border-collapse:collapse; font-size:12px; white-space:nowrap; }
  table.pf-tabla th, table.pf-tabla td { border:1px solid #e2e6ea; padding:4px 6px; vertical-align:top; }
  table.pf-tabla th { background:#f4f6f8; position:sticky; top:0; }
  table.pf-tabla td.pf-nombre { font-weight:600; white-space:normal; min-width:150px; }
  .pf-celda { display:flex; flex-direction:column; gap:2px; }
  .pf-celda select, .pf-celda input[type=number] { width:70px; font-size:11px; padding:2px; }
  .pf-nota { width:100%; min-width:220px; min-height:50px; font-size:11px; box-sizing:border-box; }
  .pf-total { font-weight:700; text-align:center; }
  .pf-nivel-ALTO { background:#e6f6ea; }
  .pf-nivel-MEDIO { background:#fff8e1; }
  .pf-nivel-BAJO { background:#fdecea; }
  textarea.pf-nota-sel { width:260px; min-height:60px; font-size:11px; box-sizing:border-box; }
  input.pf-mini { padding:3px 5px; border:1px solid #d8dde3; border-radius:5px; font-size:12px; }
</style>

<h1>Desempeño — Design Schedule</h1>
<p style="color:#6b7280;font-size:13px;margin-top:-8px">Solo administradores. Evaluaciones mensuales por equipo y selección de empleado del mes.</p>
<div class="pf-tabs" id="pfSheetTabs"></div>
<div class="pf-panel" id="pfPanel"></div>

<script>
(function() {
  function api(url) { return fetch(url).then(function(r) { return r.json(); }); }
  function postJSON(url, body) {
    return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})})
      .then(function(r) { return r.json(); });
  }
  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var PF = { sheets: [], sheetId: null, mesIdx: 0, detalle: null };

  function cargarSheets() {
    api('/design/api/perf/sheets').then(function(sheets) {
      PF.sheets = sheets;
      var cont = document.getElementById('pfSheetTabs'); cont.innerHTML = '';
      sheets.forEach(function(s) {
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'pf-tab' + (s.id === PF.sheetId ? ' activo' : '');
        btn.innerText = s.nombre;
        btn.onclick = function() { seleccionarSheet(s.id); };
        cont.appendChild(btn);
      });
      if (sheets.length) seleccionarSheet(sheets[0].id);
    });
  }

  function seleccionarSheet(sheetId) {
    PF.sheetId = sheetId;
    PF.mesIdx = 0;
    document.querySelectorAll('#pfSheetTabs .pf-tab').forEach(function(b, i) { b.classList.toggle('activo', PF.sheets[i].id === sheetId); });
    var s = PF.sheets.find(function(x) { return x.id === sheetId; });
    if (!s) return;
    if (s.tipo === 'eval') cargarEval();
    else cargarSeleccion();
  }

  function selectMeses(meses, onchange) {
    var sel = document.createElement('select');
    meses.forEach(function(m, i) {
      var op = document.createElement('option'); op.value = i; op.innerText = m;
      if (i === PF.mesIdx) op.selected = true;
      sel.appendChild(op);
    });
    sel.onchange = function() { PF.mesIdx = parseInt(this.value); onchange(); };
    return sel;
  }

  function cargarEval() {
    api('/design/api/perf/sheets/' + PF.sheetId + '/eval').then(function(d) {
      PF.detalle = d;
      if (PF.mesIdx >= d.meses.length) PF.mesIdx = 0;
      renderEval(d);
    });
  }

  function renderEval(d) {
    var panel = document.getElementById('pfPanel');
    panel.innerHTML = '';
    var toolbar = document.createElement('div'); toolbar.className = 'pf-toolbar';
    var label = document.createElement('span'); label.innerText = 'Mes:'; toolbar.appendChild(label);
    toolbar.appendChild(selectMeses(d.meses, function() { renderEval(d); }));
    panel.appendChild(toolbar);

    var tabla = document.createElement('table'); tabla.className = 'pf-tabla';
    var head = '<thead><tr><th>Diseñador/a</th>';
    d.criterios.forEach(function(c) { head += '<th style="white-space:normal;min-width:110px">' + esc(c.nombre) + '</th>'; });
    head += '<th>Total mes</th><th>Total general</th><th>Notas</th></tr></thead>';
    tabla.innerHTML = head;

    var tbody = document.createElement('tbody');
    d.empleados.forEach(function(emp) {
      var tr = document.createElement('tr');
      var tdNombre = document.createElement('td'); tdNombre.className = 'pf-nombre'; tdNombre.innerText = emp.nombre;
      tr.appendChild(tdNombre);

      d.criterios.forEach(function(crit) {
        var key = crit.id + '_' + PF.mesIdx;
        var val = emp.celdas[key] || { nivel: '', puntaje: 0 };
        var td = document.createElement('td');
        var wrap = document.createElement('div'); wrap.className = 'pf-celda';
        var sel = document.createElement('select');
        ['', 'BAJO', 'MEDIO', 'ALTO'].forEach(function(op) {
          var o = document.createElement('option'); o.value = op; o.innerText = op || '—';
          if (op === val.nivel) o.selected = true;
          sel.appendChild(o);
        });
        var num = document.createElement('input'); num.type = 'number'; num.step = '0.01'; num.value = val.puntaje || 0;
        function guardar() {
          postJSON('/design/api/perf/celdas', {
            empleadoId: emp.id, criterioId: crit.id, mesIndice: PF.mesIdx,
            nivel: sel.value, puntaje: parseFloat(num.value) || 0,
          });
          td.className = sel.value ? 'pf-nivel-' + sel.value : '';
        }
        sel.onchange = guardar; num.onchange = guardar;
        td.className = val.nivel ? 'pf-nivel-' + val.nivel : '';
        wrap.appendChild(sel); wrap.appendChild(num); td.appendChild(wrap);
        tr.appendChild(td);
      });

      var tdMes = document.createElement('td'); tdMes.className = 'pf-total';
      tdMes.innerText = ((emp.totalesMes[PF.mesIdx] || 0) * 100).toFixed(1) + '%';
      tr.appendChild(tdMes);

      var tdTotal = document.createElement('td'); tdTotal.className = 'pf-total';
      tdTotal.innerText = ((emp.total || 0) * 100).toFixed(1) + '%';
      tr.appendChild(tdTotal);

      var tdNota = document.createElement('td');
      var ta = document.createElement('textarea'); ta.className = 'pf-nota'; ta.value = emp.nota || '';
      ta.addEventListener('blur', function() {
        postJSON('/design/api/perf/empleados/' + emp.id + '/nota', { nota: this.value });
      });
      tdNota.appendChild(ta);
      tr.appendChild(tdNota);

      tbody.appendChild(tr);
    });
    tabla.appendChild(tbody);
    panel.appendChild(tabla);
  }

  function cargarSeleccion() {
    api('/design/api/perf/sheets/' + PF.sheetId + '/seleccion').then(function(d) {
      PF.detalle = d;
      if (PF.mesIdx >= d.meses.length) PF.mesIdx = 0;
      renderSeleccion(d);
    });
  }

  function renderSeleccion(d) {
    var panel = document.getElementById('pfPanel');
    panel.innerHTML = '';

    var h2 = document.createElement('h3'); h2.innerText = 'Empleado del mes'; panel.appendChild(h2);
    var tablaGan = document.createElement('table'); tablaGan.className = 'pf-tabla';
    var headGan = '<thead><tr><th>Categoría</th>';
    d.meses.forEach(function(m) { headGan += '<th>' + esc(m) + '</th>'; });
    headGan += '</tr></thead>';
    tablaGan.innerHTML = headGan;
    var bodyGan = document.createElement('tbody');
    d.ganadores.forEach(function(g) {
      var tr = document.createElement('tr');
      var tdCat = document.createElement('td'); tdCat.className = 'pf-nombre'; tdCat.innerText = g.categoria;
      tr.appendChild(tdCat);
      d.meses.forEach(function(m, i) {
        var td = document.createElement('td');
        var inp = document.createElement('input'); inp.className = 'pf-mini'; inp.style.width = '120px';
        inp.value = g.ganadoresMes[i] || '';
        inp.addEventListener('blur', function() {
          postJSON('/design/api/perf/ganadores/' + g.id, { mesIndice: i, nombre: this.value });
        });
        td.appendChild(inp); tr.appendChild(td);
      });
      bodyGan.appendChild(tr);
    });
    tablaGan.appendChild(bodyGan);
    panel.appendChild(tablaGan);

    var toolbar = document.createElement('div'); toolbar.className = 'pf-toolbar'; toolbar.style.marginTop = '20px';
    var h3 = document.createElement('h3'); h3.style.margin = '0'; h3.innerText = 'Evaluaciones por líder';
    panel.appendChild(h3);
    var toolbar2 = document.createElement('div'); toolbar2.className = 'pf-toolbar';
    var label = document.createElement('span'); label.innerText = 'Mes:'; toolbar2.appendChild(label);
    toolbar2.appendChild(selectMeses(d.meses, function() { renderSeleccion(d); }));
    panel.appendChild(toolbar2);

    var tabla = document.createElement('table'); tabla.className = 'pf-tabla';
    tabla.innerHTML = '<thead><tr><th>Evaluador/a</th><th>Persona nominada</th><th>Puntaje</th><th>Nota</th></tr></thead>';
    var tbody = document.createElement('tbody');
    d.filas.forEach(function(f) {
      var celda = f.celdas[PF.mesIdx] || { persona: '', puntaje: '', nota: '' };
      var tr = document.createElement('tr');
      var tdEv = document.createElement('td'); tdEv.className = 'pf-nombre'; tdEv.innerText = f.evaluador;
      tr.appendChild(tdEv);

      var tdPersona = document.createElement('td');
      var inpP = document.createElement('input'); inpP.className = 'pf-mini'; inpP.style.width = '140px'; inpP.value = celda.persona;
      tdPersona.appendChild(inpP); tr.appendChild(tdPersona);

      var tdScore = document.createElement('td');
      var inpS = document.createElement('input'); inpS.className = 'pf-mini'; inpS.style.width = '60px'; inpS.value = celda.puntaje;
      tdScore.appendChild(inpS); tr.appendChild(tdScore);

      var tdNota = document.createElement('td');
      var ta = document.createElement('textarea'); ta.className = 'pf-nota-sel'; ta.value = celda.nota;
      tdNota.appendChild(ta); tr.appendChild(tdNota);

      function guardar() {
        postJSON('/design/api/perf/filas/' + f.id + '/celdas', {
          mesIndice: PF.mesIdx, persona: inpP.value, puntaje: inpS.value, nota: ta.value,
        });
      }
      inpP.addEventListener('blur', guardar);
      inpS.addEventListener('blur', guardar);
      ta.addEventListener('blur', guardar);

      tbody.appendChild(tr);
    });
    tabla.appendChild(tbody);
    panel.appendChild(tabla);
  }

  cargarSheets();
})();
</script>
{% endblock %}
