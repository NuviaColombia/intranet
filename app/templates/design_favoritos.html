{% extends "base.html" %}
{% block contenido %}
<style>
  .fv-list { display:flex; flex-direction:column; gap:10px; max-width:520px; }
  .fv-item { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid #d8dde3; border-radius:10px; padding:12px 14px; }
  .fv-label { font-size:13px; font-weight:600; color:#111827; }
  .fv-link { color:#1c3a63; text-decoration:none; font-size:12px; font-weight:700; }
  .fv-quitar { background:none; border:1px solid #d8dde3; color:#6b7280; border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer; }
  .fv-quitar:hover { color:#dc2626; border-color:#dc2626; }
  .fv-empty { color:#6b7280; padding:40px; text-align:center; max-width:480px; }
</style>

<h1>⭐ Favoritos — Design Schedule</h1>
<p style="color:#6b7280;font-size:13px;margin-top:-8px">Accesos rápidos a equipos y hojas de Pre-Approved. Marca la estrella junto a un equipo o una hoja para que aparezca aquí.</p>
<div class="fv-list" id="fvList"></div>

<script>
(function() {
  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function cargar() {
    fetch('/design/api/favoritos').then(function(r) { return r.json(); }).then(render);
  }

  function render(favs) {
    var list = document.getElementById('fvList');
    if (!favs.length) {
      list.innerHTML = '<div class="fv-empty">Aún no tienes favoritos.<br>Marca un equipo con la estrella en Horario, o una hoja en Pre-Approved.</div>';
      return;
    }
    list.innerHTML = favs.map(function(f) {
      var href = f.tipo === 'team' ? ('/design?area_id=' + f.areaId + '&team_id=' + f.teamId)
                                    : ('/design/preapproved?area_id=' + f.areaId + '&sheet_id=' + f.sheetId);
      return '<div class="fv-item">' +
        '<div class="fv-label">⭐ ' + esc(f.etiqueta) + '</div>' +
        '<div style="display:flex;gap:10px;align-items:center">' +
          '<a class="fv-link" href="' + href + '">Ir →</a>' +
          '<button type="button" class="fv-quitar" data-id="' + f.id + '" data-tipo="' + f.tipo + '">Quitar</button>' +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('[data-quitar], .fv-quitar').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var url = this.dataset.tipo === 'team'
          ? '/design/api/favoritos/team/' + favs.find(function(f){ return f.id == btn.dataset.id; }).teamId + '/toggle'
          : '/design/api/favoritos/preapproved/' + favs.find(function(f){ return f.id == btn.dataset.id; }).sheetId + '/toggle';
        fetch(url, {method:'POST'}).then(cargar);
      });
    });
  }

  cargar();
})();
</script>
{% endblock %}
