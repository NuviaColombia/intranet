{# Aviso mientras un admin ve Design como otra persona (Parámetros › Simulación). #}
{% set sim_real = request.state.design_real %}
{% if sim_real %}
<style>
  .sim-aviso { position:sticky; top:0; z-index:40; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
               background:#fef3c7; color:#78350f; border:1px solid #f59e0b; border-radius:8px; padding:8px 14px; margin:0 0 12px; font-size:13px; }
  .sim-acc { display:flex; gap:6px; }
  .sim-acc form { display:inline; margin:0; }
</style>
<div class="sim-aviso" role="status">
  <span><b>Modo simulación:</b> estás viendo Design como <b>{{ user.nombre_completo }}</b> ({{ user.rol or 'empleado' }}).
    Lo que guardes queda a su nombre.</span>
  <span class="sim-acc">
    <form method="post" action="/design/simulacion/salir"><button class="btn mini gris">Cambiar persona</button></form>
    <form method="post" action="/design/simulacion/salir"><button class="btn mini">Salir de la simulación</button></form>
  </span>
</div>
{% endif %}
