{% extends "base.html" %}
{% block contenido %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<style>
  .pr-toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .pr-toolbar input[type=search] { padding:8px 12px; border:1px solid #d8dde3; border-radius:8px; font-size:13px; min-width:220px; }
  .pr-tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .pr-tab { padding:6px 14px; border-radius:8px; border:1px solid #d8dde3; background:#fff; cursor:pointer; font-weight:600; font-size:12px; }
  .pr-tab.activo { background:#1c3a63; color:#fff; border-color:#1c3a63; }
  .pr-upload { border:2px dashed #d8dde3; border-radius:10px; padding:16px; text-align:center; color:#6b7280; cursor:pointer; font-size:13px; margin-bottom:16px; }
  .pr-upload.dragover { border-color:#1c3a63; color:#1c3a63; background:#f4f6fa; }
  .pr-status { font-size:12px; color:#1c3a63; margin-top:6px; }
  .pr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
  .pr-card { background:#fff; border:1px solid #d8dde3; border-radius:10px; padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .pr-card:hover { border-color:#1c3a63; }
  .pr-area { font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:#6b7280; font-weight:700; }
  .pr-titulo { font-size:14px; font-weight:700; color:#111827; }
  .pr-desc { font-size:12px; color:#6b7280; flex:1; }
  .pr-actions { display:flex; justify-content:space-between; align-items:center; }
  .pr-fav { border:none; background:none; cursor:pointer; font-size:15px; }
  .pr-del { border:none; background:none; cursor:pointer; color:#9ca3af; font-size:13px; }
  .pr-del:hover { color:#dc2626; }
  .pr-meta { font-size:11px; color:#9ca3af; }
  .pr-empty { color:#6b7280; padding:40px; text-align:center; }
  .pr-modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; }
  .pr-modal-bg.open { display:flex; }
  .pr-modal { background:#fff; border-radius:12px; padding:24px; max-width:700px; width:100%; }
  .pr-modal h2 { margin:0 0 4px; }
  .pr-modal pre { white-space:pre-wrap; font-family:inherit; font-size:13px; color:#374151; background:#f4f6f8; border-radius:8px; padding:12px; margin-top:12px; max-height:50vh; overflow:auto; }
  .pr-form { display:flex; flex-direction:column; gap:10px; max-width:500px; margin-bottom:20px; background:#fff; border:1px solid #d8dde3; border-radius:10px; padding:16px; }
  .pr-form input, .pr-form select, .pr-form textarea { padding:7px 10px; border:1px solid #d8dde3; border-radius:6px; font-size:13px; }
  .pr-form textarea { min-height:80px; }
</style>

<h1>Protocols — Design Schedule</h1>

<div class="pr-upload" id="prUploadZone">
  <span>📄 Arrastra un PDF aquí o haz clic para seleccionar (se extrae el texto, el archivo no se guarda)</span>
  <input type="file" id="prFileInput" accept=".pdf" style="display:none">
  <div class="pr-status" id="prUploadStatus"></div>
</div>

<details style="margin-bottom:16px">
  <summary style="cursor:pointer;font-size:13px;color:#1c3a63;font-weight:600">+ Agregar protocolo manualmente</summary>
  <div class="pr-form">
    <select id="prNewArea"><option value="">Sin área específica</option></select>
    <input type="text" id="prNewTitulo" placeholder="Título">
    <input type="text" id="prNewDesc" placeholder="Descripción corta">
    <textarea id="prNewContenido" placeholder="Contenido / pasos"></textarea>
    <button type="button" class="btn mini" onclick="prCrearManual()">Guardar protocolo</button>
  </div>
</details>

<div class="pr-toolbar">
  <input type="search" id="prSearch" placeholder="Buscar por título, descripción o contenido...">
  <div class="pr-tabs" id="prAreaTabs"></div>
</div>

<div class="pr-grid" id="prGrid"></div>

<div class="pr-modal-bg" id="prModalBg">
  <div class="pr-modal">
    <span class="pr-area" id="prModalArea"></span>
    <h2 id="prModalTitulo"></h2>
    <div style="color:#6b7280;font-size:13px" id="prModalDesc"></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
      <button type="button" class="pr-fav" id="prModalFav">🤍</button>
      <span class="pr-meta" id="prModalVersion"></span>
      <button type="button" class="btn gris mini" style="margin-left:auto" onclick="document.getElementById('prModalBg').classList.remove('open')">Cerrar</button>
    </div>
    <pre id="prModalContenido"></pre>
  </div>
</div>

<script>
(function() {
  function api(url) { return fetch(url).then(function(r) { return r.json(); }); }
  function postJSON(url, body) {
    return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})})
      .then(function(r) { return r.json(); });
  }
  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var PR = { areas: [], areaId: 0, q: '', favIds: [], items: [] };

  function cargarAreas() {
    Promise.all([api('/design/api/areas'), api('/design/api/favoritos/activos')]).then(function(r) {
      PR.areas = r[0];
      PR.favIds = r[1].protocolos || [];
      var sel = document.getElementById('prNewArea');
      var tabs = document.getElementById('prAreaTabs'); tabs.innerHTML = '';
      var todos = document.createElement('button');
      todos.type = 'button'; todos.className = 'pr-tab activo'; todos.innerText = 'Todos';
      todos.onclick = function() { PR.areaId = 0; renderTabs(); cargarProtocolos(); };
      tabs.appendChild(todos);
      PR.areas.forEach(function(a) {
        var opt = document.createElement('option'); opt.value = a.id; opt.innerText = a.nombre; sel.appendChild(opt);
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'pr-tab'; btn.innerText = a.nombre;
        btn.onclick = function() { PR.areaId = a.id; renderTabs(); cargarProtocolos(); };
        tabs.appendChild(btn);
      });
      cargarProtocolos();
    });
  }

  function renderTabs() {
    var tabs = document.getElementById('prAreaTabs').children;
    for (var i = 0; i < tabs.length; i++) {
      var esTodos = i === 0;
      tabs[i].classList.toggle('activo', esTodos ? PR.areaId === 0 : PR.areas[i-1].id === PR.areaId);
    }
  }

  function cargarProtocolos() {
    var url = '/design/api/protocolos?area_id=' + PR.areaId + '&q=' + encodeURIComponent(PR.q);
    api(url).then(function(items) { PR.items = items; renderGrid(); });
  }

  function renderGrid() {
    var grid = document.getElementById('prGrid');
    if (!PR.items.length) {
      grid.innerHTML = '<div class="pr-empty">No hay protocolos que coincidan con tu búsqueda.</div>';
      return;
    }
    grid.innerHTML = PR.items.map(function(p) {
      var fav = PR.favIds.indexOf(p.id) >= 0;
      return '<div class="pr-card" data-id="' + p.id + '">' +
        '<div class="pr-area">' + esc(p.areaNombre || 'General') + '</div>' +
        '<div class="pr-titulo">' + esc(p.titulo) + '</div>' +
        '<div class="pr-desc">' + esc(p.descripcion) + '</div>' +
        '<div class="pr-actions">' +
          '<button type="button" class="pr-fav" data-fav="' + p.id + '">' + (fav ? '❤️' : '🤍') + '</button>' +
          '<span class="pr-meta">' + esc(p.version) + '</span>' +
          '<button type="button" class="pr-del" data-del="' + p.id + '">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');

    grid.querySelectorAll('[data-fav]').forEach(function(btn) {
      btn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        var id = parseInt(this.dataset.fav);
        postJSON('/design/api/favoritos/protocolo/' + id + '/toggle').then(function(res) {
          if (res.favorito) { if (PR.favIds.indexOf(id) < 0) PR.favIds.push(id); }
          else { PR.favIds = PR.favIds.filter(function(x) { return x !== id; }); }
          renderGrid();
        });
      });
    });
    grid.querySelectorAll('[data-del]').forEach(function(btn) {
      btn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (!confirm('¿Eliminar este protocolo? Podrás restaurarlo desde la Papelera.')) return;
        postJSON('/design/api/protocolos/' + this.dataset.del + '/eliminar').then(cargarProtocolos);
      });
    });
    grid.querySelectorAll('.pr-card').forEach(function(card) {
      card.addEventListener('click', function() { abrirDetalle(parseInt(this.dataset.id)); });
    });
  }

  function abrirDetalle(id) {
    api('/design/api/protocolos/' + id).then(function(p) {
      document.getElementById('prModalArea').innerText = p.areaNombre || 'General';
      document.getElementById('prModalTitulo').innerText = p.titulo;
      document.getElementById('prModalDesc').innerText = p.descripcion;
      document.getElementById('prModalVersion').innerText = 'Versión: ' + p.version;
      document.getElementById('prModalContenido').innerText = p.contenido;
      var favBtn = document.getElementById('prModalFav');
      var fav = PR.favIds.indexOf(p.id) >= 0;
      favBtn.innerText = fav ? '❤️' : '🤍';
      favBtn.onclick = function() {
        postJSON('/design/api/favoritos/protocolo/' + p.id + '/toggle').then(function(res) {
          if (res.favorito) { if (PR.favIds.indexOf(p.id) < 0) PR.favIds.push(p.id); }
          else { PR.favIds = PR.favIds.filter(function(x) { return x !== p.id; }); }
          favBtn.innerText = res.favorito ? '❤️' : '🤍';
          renderGrid();
        });
      };
      document.getElementById('prModalBg').classList.add('open');
    });
  }
  document.getElementById('prModalBg').addEventListener('click', function(ev) {
    if (ev.target === this) this.classList.remove('open');
  });

  window.prCrearManual = function() {
    var titulo = document.getElementById('prNewTitulo').value.trim();
    if (!titulo) { alert('Escribe un título.'); return; }
    var areaId = document.getElementById('prNewArea').value;
    postJSON('/design/api/protocolos', {
      areaId: areaId ? parseInt(areaId) : null,
      titulo: titulo,
      descripcion: document.getElementById('prNewDesc').value,
      contenido: document.getElementById('prNewContenido').value,
    }).then(function() {
      document.getElementById('prNewTitulo').value = '';
      document.getElementById('prNewDesc').value = '';
      document.getElementById('prNewContenido').value = '';
      cargarProtocolos();
    });
  };

  document.getElementById('prSearch').addEventListener('input', function() {
    PR.q = this.value; cargarProtocolos();
  });

  // ---------- Carga de PDF (extracción de texto en el navegador, con pdf.js) ----------
  var uploadZone = document.getElementById('prUploadZone');
  var fileInput = document.getElementById('prFileInput');
  uploadZone.addEventListener('click', function() { fileInput.click(); });
  uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', function() { uploadZone.classList.remove('dragover'); });
  uploadZone.addEventListener('drop', function(e) { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFileUpload(e.dataTransfer.files); });
  fileInput.addEventListener('change', function(e) { handleFileUpload(e.target.files); });

  function handleFileUpload(files) {
    var statusEl = document.getElementById('prUploadStatus');
    if (!files.length) return;
    var file = files[0];
    statusEl.textContent = 'Extrayendo contenido...';
    var reader = new FileReader();
    reader.onload = function(e) {
      pdfjsLib.getDocument({data: e.target.result}).promise.then(function(pdf) {
        var fullText = '';
        var pagePromises = [];
        for (var i = 1; i <= pdf.numPages; i++) {
          pagePromises.push((function(pageNum) {
            return pdf.getPage(pageNum).then(function(page) { return page.getTextContent(); })
              .then(function(textContent) { return textContent.items.map(function(item) { return item.str; }).join(' '); });
          })(i));
        }
        Promise.all(pagePromises).then(function(pageTexts) {
          fullText = pageTexts.join('\n');
          var titulo = file.name.replace(/\.pdf$/i, '');
          postJSON('/design/api/protocolos', {
            titulo: titulo, descripcion: 'Protocolo extraído de PDF', contenido: fullText.trim(),
          }).then(function() {
            statusEl.textContent = '✓ Protocolo agregado';
            setTimeout(function() { statusEl.textContent = ''; fileInput.value = ''; }, 2000);
            cargarProtocolos();
          });
        });
      }).catch(function(err) {
        statusEl.textContent = '❌ Error al procesar PDF: ' + err.message;
        setTimeout(function() { statusEl.textContent = ''; }, 3000);
      });
    };
    reader.readAsArrayBuffer(file);
  }

  cargarAreas();
})();
</script>
{% endblock %}
