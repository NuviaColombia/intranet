services:
  - type: web
    name: solicitudes-nuvia
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REGION
        sync: false
      - key: ZOHO_MAIL_CLIENT_ID
        sync: false
      - key: ZOHO_MAIL_CLIENT_SECRET
        sync: false
      - key: ZOHO_MAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ZOHO_CLIQ_CLIENT_ID
        sync: false
      - key: ZOHO_CLIQ_CLIENT_SECRET
        sync: false
      - key: ZOHO_CLIQ_REFRESH_TOKEN
        sync: false
